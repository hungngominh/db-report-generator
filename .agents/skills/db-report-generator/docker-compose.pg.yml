# Local PostgreSQL matrix for unit-collector tests (P0+). Not used in P-1 tests.
services:
  pg14:
    image: postgres:14
    environment: {POSTGRES_PASSWORD: postgres}
    ports: ["55432:5432"]
  pg15:
    image: postgres:15
    environment: {POSTGRES_PASSWORD: postgres}
    ports: ["55433:5432"]
  pg16:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres}
    ports: ["55434:5432"]
  pg17:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: postgres}
    ports: ["55435:5432"]
  pg18:
    image: postgres:18
    environment: {POSTGRES_PASSWORD: postgres}
    ports: ["55436:5432"]
